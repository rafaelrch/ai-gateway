spring.application.name=ai-gateway

# Corrente de validação (Chain of Responsibility)
# Limite de tokens estimados por prompt. Acima disso o TamanhoHandler barra.
gateway.chain.max-tokens=100
# Termos que o ConteudoHandler barra. Separados por vírgula, sem acento.
gateway.chain.termos-proibidos=senha,cpf,cartao de credito
