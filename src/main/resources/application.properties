spring.application.name=ai-gateway

# Corrente de validação (Chain of Responsibility)
# Limite de tokens estimados por prompt. Acima disso o TamanhoHandler barra.
gateway.chain.max-tokens=100
# Termos que o ConteudoHandler barra. Separados por vírgula, sem acento.
gateway.chain.termos-proibidos=senha,cpf,cartao de credito

# Provedores (Strategy + Decorator)
# Tentativas totais do RetryProviderDecorator antes de devolver 503.
gateway.provider.max-tentativas=3
# Chance de falha do MockEconomicoProvider (0.0 a 1.0).
gateway.provider.economico.taxa-falha=0.4

# Uso (Observer)
# Requisição que custar mais que isso (em reais) gera alerta no log.
gateway.usage.alerta-custo=0.005

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
